name: Stage 8 resource zones

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'db/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/build-public.mjs'
      - 'package.json'
      - 'aleph.config.json'
      - 'README.md'
      - '.github/workflows/stage8-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check commit and status
        run: |
          git status --short
          git log -1 --oneline
          test -z "$(git status --porcelain)"
      - run: npm ci
      - run: npm run decider:test
      - run: npm run fixture:7
      - run: node --test test/r7.test.mjs
      - run: npm run test:r8
      - run: node --test test/judge-owner-identity.test.mjs
      - run: npm run build -- --local
      - run: npm run test:r5
      - run: npm run xdr:test
      - name: Prepare ignored submission explanation
        run: |
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const explanation = [
            '8단계: 메모와 강사 공지를 별도 자원 ID, API 및 RLS 테이블로 분리했습니다.',
            '판정기는 정확한 경로를, API는 저장된 소유자와 서버 강사 권한을 검증합니다.',
            '실제 A/B 사용자 및 강사 E2E는 미실행이며 기존 기능을 보존했습니다.',
          ].join('\n');
          writeFileSync('bundle-notes.json', JSON.stringify({ explanation }, null, 2) + '\n');
          NODE
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stage8-submission
          path: artifacts/submission.json
          if-no-files-found: error
