name: Stage 12 war-room evidence and prior stages

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'db/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/build-public.mjs'
      - 'package.json'
      - 'aleph.config.json'
      - 'README.md'
      - '.github/workflows/stage8-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check commit and status
        run: |
          git status --short
          git log -1 --oneline
          test -z "$(git status --porcelain)"
      - run: npm ci
      - run: npm run decider:test
      - run: npm run fixture:7
      - run: node --test test/r7.test.mjs
      - run: npm run detect:test
      - run: node --test test/detect.test.mjs
      - run: node --test test/stage10.test.mjs
      - run: node --test test/stage11.test.mjs
      - run: node --test test/stage12.test.mjs
      - run: npm run test:r8
      - run: node --test test/judge-owner-identity.test.mjs
      - run: node --test test/stage8-audit.test.mjs
      - run: npm run build -- --local
      - run: node --test test/stage11-icons.test.mjs
      - run: npm run test:r5
      - run: npm run xdr:test
      - name: Prepare ignored submission explanation
        run: |
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const explanation = [
            '12단계: 판정 규칙, 탐지 기록 미연동, 기기 회수 기록, 검증된 복구 버전을 작전실에 표시합니다.',
            '사전 허용된 안전 HTTP 검사만 요청 ID와 시각/실측 응답을 기록하며 공식 41종 결과는 미연동입니다.',
            'ALEPH SDP 제공 엔진과 학생 판정/탐지/PWA/기기 보안/복구 코드를 구분하고 기존 단계를 보존합니다.',
          ].join('\n');
          writeFileSync('bundle-notes.json', JSON.stringify({ explanation }, null, 2) + '\n');
          NODE
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-submission
          path: artifacts/submission.json
          if-no-files-found: error
