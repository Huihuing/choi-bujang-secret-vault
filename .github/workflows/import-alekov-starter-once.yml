name: Import ALEKOV 0.2.11 starter (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-alekov-starter-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned official starter archive
        run: |
          curl -fL --retry 2 --max-time 90 -o /tmp/alekov-starter-0.2.11.zip 'https://aleph-workbench-downloads.vercel.app/alekov-starter-0.2.11.zip'
          printf '%s  %s\n' 'd57005384b36bd87bf7ad59926d11c3fc3054dc8574ccd9d788db47923477266' '/tmp/alekov-starter-0.2.11.zip' | sha256sum -c -
      - name: Copy starter into new on-client directory, preserve original project
        run: |
          python3 - <<'PY'
          import os, sys, zipfile
          from pathlib import Path
          archive=Path('/tmp/alekov-starter-0.2.11.zip')
          target=Path('on-client')
          if target.exists():
              sys.exit('Refusing to overwrite an existing on-client directory')
          if not Path('student/extension.mjs').is_file():
              sys.exit('Missing previously implemented student/extension.mjs; refusing import')
          with zipfile.ZipFile(archive) as z:
              entries=z.infolist()
              if len(entries)!=57 or z.testzip() is not None:
                  sys.exit('Unexpected archive members or damaged archive')
              names=[e.filename for e in entries]
              if len(set(names))!=len(names) or 'on-client/student/extension.mjs' not in names:
                  sys.exit('Duplicate entries or missing student implementation slot')
              for entry in entries:
                  parts=Path(entry.filename).parts
                  if not parts or parts[0]!='on-client' or '..' in parts or entry.filename.startswith('/'):
                      sys.exit('Unsafe path in archive: '+entry.filename)
                  if (entry.external_attr>>16)&0o170000==0o120000:
                      sys.exit('Symlinks forbidden in starter')
              for entry in entries:
                  dest=Path(entry.filename)
                  if entry.is_dir():
                      dest.mkdir(parents=True,exist_ok=True)
                  else:
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      with dest.open('wb') as stream:
                          stream.write(z.read(entry))
          # The previously reviewed student implementation is preserved verbatim.
          (target/'student/extension.mjs').write_bytes(Path('student/extension.mjs').read_bytes())
          # The provided UI and server files remain identical to the verified archive.
          for key in ['public/app.js','public/index.html','src/server.mjs']:
              with zipfile.ZipFile(archive) as z:
                  if (target/key).read_bytes()!=z.read('on-client/'+key):
                      sys.exit('Unexpected modification to official provided file: '+key)
          # Self-remove this one-time import workflow; it is not part of the student project.
          Path('.github/workflows/import-alekov-starter-once.yml').unlink()
          print('Copied official archive; student renderIdentity preserved; root 1-12 unchanged')
          PY
      - name: Verify student's module and provided UI
        run: |
          node --check on-client/student/extension.mjs
          node --check on-client/public/app.js
          node --check on-client/src/server.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const app=fs.readFileSync('on-client/public/app.js','utf8');
          const ui=fs.readFileSync('on-client/public/index.html','utf8');
          const student=fs.readFileSync('on-client/student/extension.mjs','utf8');
          assert(app.includes("const STUDENT_MODULE = '/student/extension.mjs'"));
          assert(app.includes('renderIdentity()')&&app.includes("renderStudent('identity')"));
          assert(app.includes('target.replaceChildren('));
          assert(app.includes("me: snapshot(state.me), devices: snapshot(state.devices), sessions: snapshot(state.sessions)"));
          assert(app.includes("state[key] = { status: 'loading' }"));
          assert(ui.includes('student-identity'));
          assert(student.includes('statusText')&&student.includes("state.status === 'error'"));
          assert(!student.includes('innerHTML'));
          console.log('Static source contract checks passed');
          NODE
      - name: Commit new official files (no original file modifications)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- on-client .github/workflows/import-alekov-starter-once.yml
          git diff --cached --name-status
          git diff --cached --name-only | grep -vE '^(on-client/|.github/workflows/import-alekov-starter-once.yml$)' && { echo 'Unexpected original file changes'; exit 1; } || true
          git diff --cached --quiet && { echo 'No change'; exit 1; } || true
          git commit -m 'feat(stage13): include official ALEKOV on-client starter and preserve renderIdentity'
          git push origin HEAD:main
          git rev-parse HEAD
