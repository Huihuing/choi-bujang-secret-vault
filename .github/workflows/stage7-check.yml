name: Stage 7 step-up decision

on:
  push:
    branches: [main]
    paths:
      - 'src/decider.mjs'
      - 'src/attack-check.mjs'
      - 'scripts/build-public.mjs'
      - 'test/r7.test.mjs'
      - 'aleph.config.json'
      - 'README.md'
      - '.github/workflows/stage7-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify checkout and latest commit
        run: |
          git status --short
          git log -1 --oneline
          test -z "$(git status --porcelain)"
      - run: npm ci
      - run: npm run decider:test
      - run: npm run fixture:7
      - run: node --test test/r7.test.mjs
      - run: npm run build -- --local
      - run: npm run test:r5
      - run: npm run xdr:test
      - name: Prepare ignored submission explanation
        run: |
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const explanation = [
            '7단계: 검증된 복합 이상 접속에만 step_up_required 추가 확인을 요청합니다.',
            '등록 기기 조건을 유지하고 지역 단독 및 미확인 클라이언트 출처를 위험 증거로 사용하지 않습니다.',
            '실제 새 로그인 및 자료 접근 통제는 운영 엔진 심판 미실행이며 가상 판정 테스트만 확인했습니다.',
          ].join('\n');
          writeFileSync('bundle-notes.json', JSON.stringify({ explanation }, null, 2) + '\n');
          NODE
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stage7-submission
          path: artifacts/submission.json
          if-no-files-found: error
