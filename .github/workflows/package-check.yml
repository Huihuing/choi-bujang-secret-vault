name: P1-P8 package candidate checks

on:
  push:
    branches:
      - 'feat/ztna-xdr-package-*'
    paths:
      - 'package/**'
      - 'api/ai.js'
      - 'api/threat-intel.js'
      - 'src/package-*.mjs'
      - 'db/package-ai-quota.sql'
      - 'test/package.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/package-secret-check.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/package-check.yml'
  pull_request:
    paths:
      - 'package/**'
      - 'api/ai.js'
      - 'api/threat-intel.js'
      - 'src/package-*.mjs'
      - 'db/package-ai-quota.sql'
      - 'test/package.test.mjs'
      - 'package.json'
      - '.github/workflows/package-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/package-secret-check.mjs
      - run: npm run package:check
      - run: npm run decider:test
      - run: npm run test:r5
      - run: npm run fixture:7
      - run: npm run detect:test
      - run: node --test test/stage10.test.mjs test/stage11.test.mjs test/stage12.test.mjs test/stage12-public.test.mjs test/judge-owner-identity.test.mjs test/watchdogs-site.test.mjs
      - run: npm run test:r8
      - run: npm run xdr:test
      - run: npm run build -- --local
      - name: Check package demo HTTP from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          base="https://watchdogs-ztna-xdr-package-20261030.vercel.app"
          check() {
            path="$1"
            expected="$2"
            actual=""
            for i in 1 2 3; do
              actual="$(curl --location --silent --show-error \
                --max-time 12 --output /dev/null --write-out '%{http_code}' \
                "$base$path" || true)"
              if [ "$actual" = "$expected" ]; then
                echo "PASS $path: HTTP $actual"
                return 0
              fi
              sleep 2
            done
            echo "FAIL $path: got $actual, expected $expected" >&2
            return 1
          }
          check "/" "200"
          check "/api/ai" "401"
          check "/api/threat-intel?cve=CVE-2021-44228" "401"
