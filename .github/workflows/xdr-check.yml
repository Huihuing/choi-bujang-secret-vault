name: XDR check

on:
  push:
    branches: [main]
    paths:
      - 'xdr/**'
      - 'src/xdr-decider.mjs'
      - 'scripts/xdr-run.mjs'
      - 'test/*injection*.test.mjs'
      - 'test/brute-force.test.mjs'
      - 'package.json'
      - '.github/workflows/xdr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run xdr:test
      - run: npm run xdr:run -- brute-force
      - run: npm run xdr:run -- web-injection
      - run: npm run test:r5
      - name: Generated result files are current
        run: git diff --exit-code -- xdr/brute-force/result.json xdr/web-injection/result.json
      - name: Brute-force deny rule has a future expiry
        run: node -e "const d=require('./xdr/brute-force/deny-rules.json'); if(!d.rules.length || d.rules.some(r => Date.parse(r.expiresAt) <= Date.now())) process.exit(1)"
      - name: Web injection rules carry evidence and expiry
        run: node -e "const d=require('./xdr/web-injection/deny-rules.json'); if(d.length !== 8 || d.some(r => !r.alertId || !r.expiresAt)) process.exit(1)"
