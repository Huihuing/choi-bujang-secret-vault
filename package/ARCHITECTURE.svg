<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">WATCHDOGS package architecture</title>
<desc id="desc">Browser uses existing Vercel security APIs; new authenticated AI relay and threat intelligence proxy use server-only keys and trusted external sources. Local Windows monitor is separate.</desc>
<rect width="1200" height="650" fill="#0b1220"/>
<text x="50" y="60" fill="#e2e8f0" font-family="sans-serif" font-size="29" font-weight="bold">WATCHDOGS / ZTNA + XDR — Package architecture</text>
<text x="50" y="92" fill="#94a3b8" font-family="sans-serif" font-size="16">Code boundaries, not an assertion of live SDP/AI integration</text>
<g font-family="sans-serif" text-anchor="middle" font-size="16" fill="#e2e8f0">
<rect x="45" y="150" width="230" height="115" rx="16" fill="#17324b" stroke="#60a5fa"/>
<text x="160" y="183">Browser (public/)</text><text x="160" y="213" font-size="13">login / read-only UI</text><text x="160" y="236" font-size="13">no server secrets</text>
<rect x="335" y="135" width="290" height="145" rx="16" fill="#1a3946" stroke="#34d399"/>
<text x="480" y="167">Existing Vercel api/</text><text x="480" y="196" font-size="13">JWT verification + ownership</text><text x="480" y="219" font-size="13">ZTNA decider / XDR guard</text><text x="480" y="242" font-size="13">Supabase RLS &amp; audit</text>
<rect x="710" y="135" width="405" height="145" rx="16" fill="#2d224b" stroke="#a78bfa"/>
<text x="910" y="168">New package endpoints (server only)</text>
<text x="910" y="199" font-size="13">api/ai.js → DB atomic quota → OpenAI</text>
<text x="910" y="228" font-size="13">api/threat-intel.js → NVD + CISA KEV</text>
<text x="910" y="252" font-size="13">Verified student JWT required</text>
<rect x="45" y="375" width="525" height="145" rx="16" fill="#302a1f" stroke="#fbbf24"/>
<text x="307" y="411">Windows local companion (on-client/)</text>
<text x="307" y="440" font-size="13">5189 security agent / 5191 PC monitor</text>
<text x="307" y="466" font-size="13">CPU / memory / disk / Windows events</text>
<text x="307" y="491" font-size="13">not hosted inside Vercel</text>
<rect x="670" y="375" width="445" height="145" rx="16" fill="#372232" stroke="#fb7185"/>
<text x="890" y="411">External SDP/XDR source engine</text>
<text x="890" y="443" font-size="13">requires operator connection / approval</text>
<text x="890" y="470" font-size="13">live enforcement not yet verified</text>
</g>
<g fill="none" stroke-width="3" stroke-linecap="round">
<path d="M275 205 H330" stroke="#60a5fa"/><path d="M323 197 L332 205 L323 213" stroke="#60a5fa"/>
<path d="M625 205 H705" stroke="#a78bfa"/><path d="M698 197 L707 205 L698 213" stroke="#a78bfa"/>
<path d="M570 445 H665" stroke="#fb7185" stroke-dasharray="8 8"/>
</g>
<text x="50" y="593" font-family="sans-serif" fill="#94a3b8" font-size="14">Source of truth: src/verify-login.mjs, src/decider.mjs, src/xdr-decider.mjs, src/package-auth.mjs, src/package-threat-intel.mjs.</text>
</svg>
